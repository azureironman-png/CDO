<div class="app-shell">
  <header class="app-header">
    <div class="app-header__spacer"></div>
    <h1 class="app-header__title">CUSTOMER DATA ESSENTIALS</h1>
    <div class="app-header__right">
      <span class="app-header__code">CDOMT01</span>
      <button class="linkish" type="button" (click)="createAccount()">New Account</button>
    </div>
  </header>

  <nav class="app-subnav">
    <a
      routerLink="/customers"
      routerLinkActive="is-active"
      [routerLinkActiveOptions]="{ exact: true }"
      >Customer Search</a
    >
    @for (item of customerNav(); track item.path) {
      <a [routerLink]="item.path" routerLinkActive="is-active">{{ item.label }}</a>
    }
  </nav>

  <main class="app-main">
    <router-outlet />
  </main>
</div>
