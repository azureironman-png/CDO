<mat-sidenav-container class="shell">
  <mat-sidenav class="shell__nav" mode="side" opened>
    <div class="brand">
      <span class="brand__mark">CDO</span>
      <span class="brand__sub">Customer Data Ops</span>
    </div>

    <nav class="nav-block">
      <p class="nav-label">Workspace</p>
      <mat-nav-list>
        <a
          mat-list-item
          routerLink="/customers"
          routerLinkActive="is-active"
          [routerLinkActiveOptions]="{ exact: true }"
        >
          <mat-icon matListItemIcon>search</mat-icon>
          <span matListItemTitle>Customer Summary</span>
        </a>
        <a mat-list-item routerLink="/customers/new" routerLinkActive="is-active">
          <mat-icon matListItemIcon>person_add</mat-icon>
          <span matListItemTitle>Create New Account</span>
        </a>
      </mat-nav-list>
    </nav>

    @if (customerNav().length) {
      <nav class="nav-block">
        <p class="nav-label">Selected party</p>
        <mat-nav-list>
          @for (item of customerNav(); track item.path) {
            <a mat-list-item [routerLink]="item.path" routerLinkActive="is-active">
              <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
              <span matListItemTitle>{{ item.label }}</span>
            </a>
          }
        </mat-nav-list>
      </nav>
    }

    <div class="shell__footnote">
      Angular UI → Middleware ETL → MDM
    </div>
  </mat-sidenav>

  <mat-sidenav-content>
    <header class="topbar">
      <div>
        <p class="topbar__kicker">Master data management</p>
        <h1 class="topbar__title">Customer workspace</h1>
      </div>
      <button mat-flat-button color="primary" type="button" (click)="createAccount()">
        <mat-icon>add</mat-icon>
        New account
      </button>
    </header>
    <main class="shell__main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
